server:
  # Railway le avisa al backend en qué puerto escuchar con PORT; en la compu, 8080
  port: ${PORT:8080}
  error:
    whitelabel:
      enabled: false
    include-message: always

# La base que levanta docker-compose.yml
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/reservas
    username: reservas
    password: reservas
  data:
    mongodb:
      uri: mongodb://localhost:27017/reservas

# Dónde se guarda el historial: mongo (el principal) o postgres (el respaldo)
historial:
  motor: mongo

# Desde qué dirección puede llamar el front (en Railway: CORS_ORIGEN con la del front)
cors:
  origen: http://localhost:5173
