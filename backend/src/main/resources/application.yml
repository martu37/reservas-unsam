server:
  port: 8080
  error:
    whitelabel:
      enabled: false
    include-message: always

# La base que levanta docker-compose.yml
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/reservas
    username: reservas
    password: reservas
  data:
    mongodb:
      uri: mongodb://localhost:27017/reservas

# Dónde se guarda el historial: mongo (el principal) o postgres (el respaldo)
historial:
  motor: mongo
